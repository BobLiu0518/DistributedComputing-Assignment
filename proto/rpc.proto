syntax = "proto3";
package rpc;
option go_package = "rpc-server/pb";

message RpcRequest {
  string request_id = 1;
  string service = 2;
  string method = 3;
  bytes payload = 4;
}

message RpcResponse {
  string request_id = 1;
  bytes payload = 2;
  Error error = 3;
}

message Error {
  int32 code = 1;
  string message = 2;
}
